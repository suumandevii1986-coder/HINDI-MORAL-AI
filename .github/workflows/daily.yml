name: Daily Hindi Moral Story

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install requests gTTS pillow

      - name: Generate Hindi Story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_story.py

      - name: Generate Hindi Voice
        run: python generate_voice.py

      - name: Generate AI Cartoon Images
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python generate_images.py

      - name: Create Video
        run: python make_video.py

      - name: Save Generated Files
        uses: actions/upload-artifact@v4
        with:
          name: Hindi-Moral-Story-Video
          path: |
            story.txt
            voice.mp3
            final_video.mp4
            scenes/
          retention-days: 7
