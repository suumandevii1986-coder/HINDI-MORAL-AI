name: Daily Hindi Moral Story

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: pip install requests gTTS

      - name: Generate Hindi Story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_story.py

      - name: Generate Hindi Voice
        run: python generate_voice.py

      - name: Save Story and Voice
        uses: actions/upload-artifact@v4
        with:
          name: Hindi-Moral-Story
          path: |
            story.txt
            voice.mp3
          retention-days: 7
